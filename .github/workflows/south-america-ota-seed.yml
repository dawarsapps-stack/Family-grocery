name: South America OTA seed

on:
  push:
    branches: ['south-america-ota']
    paths:
      - '.github/workflows/south-america-ota-seed.yml'
      - 'south-america-trip/v2.p*.b64'
      - 'south-america-trip/apply-route-patch.mjs'
      - 'south-america-trip/apply-solo-route-patch.mjs'
      - 'south-america-trip/enable-shared-editing.mjs'
      - 'south-america-trip/route-patch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: south-america-ota-seed
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: south-america-ota
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Reconstruct exact current app without Netlify
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/south-america-trip"
          BUILD="$RUNNER_TEMP/sa-build"
          rm -rf "$BUILD"
          mkdir -p "$BUILD"
          cp "$ROOT"/v2.p*.b64 "$BUILD"/
          cp "$ROOT"/apply-route-patch.mjs "$BUILD"/
          cp "$ROOT"/apply-solo-route-patch.mjs "$BUILD"/
          cp "$ROOT"/enable-shared-editing.mjs "$BUILD"/
          cp "$ROOT"/route-patch.json "$BUILD"/
          cd "$BUILD"
          cat v2.p01.b64 v2.p02.b64 v2.p03.b64 v2.p04.b64 v2.p05.b64 v2.p06.b64 v2.p07.b64 v2.p08.b64 v2.p09.b64 v2.p10.b64 v2.p11.b64 v2.p12.b64 v2.p13.b64 v2.p14.b64 v2.p15.b64 v2.p16.b64 | base64 -d > v2.tgz
          echo '7d5cb9cae46edfd845760fda3d1817c5eb0bc7c5e07040a73c80b181b9d62d70  v2.tgz' | sha256sum -c -
          tar -xzf v2.tgz
          node apply-route-patch.mjs
          node apply-solo-route-patch.mjs
          node enable-shared-editing.mjs
          rm -rf "$ROOT/ota"
          cp -R public "$ROOT/ota"
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root=process.env.GITHUB_WORKSPACE + '/south-america-trip/ota';
          const files=fs.readdirSync(root).filter(f=>fs.statSync(path.join(root,f)).isFile());
          const manifest={version:process.env.GITHUB_SHA,generatedAt:new Date().toISOString(),files};
          fs.writeFileSync(path.join(root,'ota-manifest.json'),JSON.stringify(manifest,null,2)+'\n');
          NODE
      - name: Commit generated OTA baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'south-america-ota-bot'
          git config user.email 'south-america-ota-bot@users.noreply.github.com'
          git add south-america-trip/ota
          if git diff --cached --quiet; then
            echo 'OTA baseline already current'
            exit 0
          fi
          git commit -m "Seed South America OTA baseline"
          git push origin HEAD:south-america-ota
