<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3E6259" />
<title>Larder — family grocery list</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F5EE;
    --card:#FDFCF8;
    --ink:#23281F;
    --ink-soft:#5B6357;
    --accent:#3E6259;
    --accent-soft:#E3EAE4;
    --gold:#C98A2B;
    --gold-soft:#F5E9D3;
    --rust:#AE4C36;
    --line:#DCE1D3;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:56px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}

  header.top{
    background:var(--accent);
    color:var(--paper);
    padding:22px 16px 20px;
    border-radius:0 0 20px 20px;
  }
  header.top .inner{max-width:560px;margin:0 auto;}
  header.top h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  header.top p{margin:0;font-size:13px;opacity:0.85;}
  .whoami{
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    opacity:0.9;
  }
  .whoami button{
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.35);
    color:var(--paper);
    border-radius:999px;
    padding:4px 12px;
    font-size:12px;
    font-family:inherit;
  }

  .addbar{
    margin-top:16px;
    display:flex;
    gap:8px;
  }
  .addbar input{
    flex:1;
    border:none;
    border-radius:12px;
    padding:13px 14px;
    font-size:15px;
    font-family:inherit;
    background:var(--card);
    color:var(--ink);
  }
  .addbar input::placeholder{color:#8B9385;}
  .addbar button{
    background:var(--gold);
    color:#2A1B05;
    border:none;
    border-radius:12px;
    padding:0 18px;
    font-weight:600;
    font-size:15px;
    font-family:inherit;
  }

  main{padding-top:18px;}
  .section-label{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin:22px 2px 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-label .count{
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:999px;
    padding:2px 8px;
    font-size:11px;
  }

  .empty{
    color:var(--ink-soft);
    font-size:14px;
    padding:18px 4px;
    line-height:1.5;
  }

  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:8px;
    overflow:hidden;
  }
  .item-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 14px;
  }
  .check{
    width:24px;height:24px;
    border-radius:50%;
    border:2px solid var(--accent);
    flex:none;
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;
  }
  .check.done{background:var(--accent);}
  .check svg{width:13px;height:13px;stroke:var(--paper);fill:none;stroke-width:3;display:none;}
  .check.done svg{display:block;}

  .item.bought .check{border-color:var(--gold);}
  .item.bought .check.replenish{background:transparent;}

  .item-main{flex:1;min-width:0;}
  .item-name{font-size:15.5px;font-weight:500;line-height:1.3;}
  .item.bought .item-name{color:var(--ink-soft);}
  .item-meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:3px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .item-meta span{display:inline-flex;align-items:center;gap:3px;}

  .item-actions{display:flex;gap:6px;flex:none;}
  .icon-btn{
    background:none;border:none;
    color:var(--ink-soft);
    padding:4px;
    font-size:13px;
    font-family:inherit;
  }
  .icon-btn.danger{color:var(--rust);}

  .comments{
    border-top:1px solid var(--line);
    padding:10px 14px 12px;
    background:#FAF9F4;
  }
  .comment{
    font-size:13px;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
    line-height:1.4;
  }
  .comment:last-of-type{border-bottom:none;}
  .comment b{font-weight:600;color:var(--accent);}
  .comment-form{
    display:flex;gap:6px;margin-top:8px;
  }
  .comment-form input{
    flex:1;
    border:1px solid var(--line);
    border-radius:9px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
    background:#fff;
  }
  .comment-form button{
    background:var(--accent);
    color:var(--paper);
    border:none;
    border-radius:9px;
    padding:0 12px;
    font-size:13px;
    font-family:inherit;
  }

  .replenish-btn{
    font-size:12px;
    background:var(--accent-soft);
    color:var(--accent);
    border:none;
    border-radius:999px;
    padding:5px 11px;
    font-family:inherit;
    font-weight:500;
    flex:none;
    align-self:center;
  }

  .toggle-history{
    background:none;border:none;color:var(--ink-soft);
    font-size:13px;font-family:inherit;
    padding:4px 2px;
    display:flex;align-items:center;gap:4px;
  }

  .status-bar{
    position:fixed;bottom:0;left:0;right:0;
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    padding:8px 0 max(8px, env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 60%, transparent);
  }
  .status-bar.offline{color:var(--rust);}

  dialog{
    border:none;border-radius:16px;
    padding:0;max-width:320px;width:88vw;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  dialog::backdrop{background:rgba(30,35,25,0.45);}
  .dialog-inner{padding:22px;}
  .dialog-inner h2{
    font-family:'Fraunces',serif;
    font-size:20px;margin:0 0 6px;
  }
  .dialog-inner p{font-size:13px;color:var(--ink-soft);margin:0 0 14px;}
  .dialog-inner input{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
    margin-bottom:12px;
  }
  .dialog-inner button{
    width:100%;
    background:var(--accent);
    color:var(--paper);
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
  }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <h1>Larder</h1>
    <p>The family's shared list — always in sync.</p>
    <div class="whoami">
      <span id="whoamiLabel">Signed in as —</span>
      <button id="changeNameBtn">switch</button>
    </div>
    <form class="addbar" id="addForm">
      <input id="addInput" type="text" placeholder="Add something to buy…" autocomplete="off" />
      <button type="submit">Add</button>
    </form>
  </div>
</header>

<div class="wrap">
  <main>
    <div class="section-label">
      <span>Need to buy</span>
      <span class="count" id="needCount">0</span>
    </div>
    <div id="needList"></div>

    <div class="section-label" id="boughtToggle" style="cursor:pointer;">
      <span>Previously bought ▾</span>
      <span class="count" id="boughtCount">0</span>
    </div>
    <div id="boughtList" style="display:none;"></div>
  </main>
</div>

<div class="status-bar" id="statusBar">syncing…</div>

<dialog id="nameDialog">
  <div class="dialog-inner">
    <h2>Who's this?</h2>
    <p>Your name shows up next to items and comments you add. Only stored on this phone.</p>
    <input id="nameInput" type="text" placeholder="e.g. Sahil" autocomplete="off" />
    <button id="nameSubmit">Continue</button>
  </div>
</dialog>

<script>
(function(){
  "use strict";

  const API = "/api/data";
  const NAME_KEY = "larder_name";
  const POLL_MS = 4000;

  let state = { items: [] };
  let expanded = new Set();
  let boughtOpen = false;
  let pending = false;
  let lastSynced = 0;

  const $ = (id) => document.getElementById(id);
  const nameDialog = $("nameDialog");
  const statusBar = $("statusBar");

  function myName(){ return localStorage.getItem(NAME_KEY) || ""; }
  function setMyName(n){
    localStorage.setItem(NAME_KEY, n);
    $("whoamiLabel").textContent = "Signed in as " + n;
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function timeAgo(ts){
    if(!ts) return null;
    const diff = Date.now() - ts;
    const day = 86400000;
    if(diff < 3600000) return Math.max(1,Math.round(diff/60000)) + "m ago";
    if(diff < day) return Math.round(diff/3600000) + "h ago";
    const days = Math.round(diff/day);
    if(days === 1) return "yesterday";
    if(days < 14) return days + "d ago";
    return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  }

  async function fetchState(){
    try{
      const res = await fetch(API, {cache:"no-store"});
      if(!res.ok) throw new Error("bad response");
      const data = await res.json();
      state = data && Array.isArray(data.items) ? data : {items:[]};
      lastSynced = Date.now();
      setStatus(false);
      render();
    }catch(e){
      setStatus(true);
    }
  }

  async function pushState(){
    pending = true;
    try{
      const res = await fetch(API, {
        method:"POST",
        headers:{"content-type":"application/json"},
        body: JSON.stringify(state)
      });
      if(!res.ok) throw new Error("save failed");
      setStatus(false);
    }catch(e){
      setStatus(true);
    }finally{
      pending = false;
    }
  }

  function setStatus(offline){
    statusBar.classList.toggle("offline", offline);
    statusBar.textContent = offline
      ? "offline — changes will save once you're back online"
      : "synced with the family list";
  }

  function addItem(name){
    name = name.trim();
    if(!name) return;
    const existing = state.items.find(i => i.name.toLowerCase() === name.toLowerCase() && !i.needed);
    if(existing){
      existing.needed = true;
      existing.addedBy = myName();
      existing.addedAt = Date.now();
    } else {
      state.items.unshift({
        id: uid(),
        name,
        needed: true,
        addedBy: myName(),
        addedAt: Date.now(),
        lastBought: null,
        history: [],
        comments: []
      });
    }
    render();
    pushState();
  }

  function markBought(item){
    item.needed = false;
    item.lastBought = Date.now();
    item.history = item.history || [];
    item.history.unshift({date: Date.now(), by: myName()});
    render();
    pushState();
  }

  function replenish(item){
    item.needed = true;
    item.addedBy = myName();
    item.addedAt = Date.now();
    render();
    pushState();
  }

  function removeItem(item){
    state.items = state.items.filter(i => i.id !== item.id);
    render();
    pushState();
  }

  function addComment(item, text){
    text = text.trim();
    if(!text) return;
    item.comments = item.comments || [];
    item.comments.push({id: uid(), text, by: myName(), at: Date.now()});
    render();
    pushState();
  }

  function itemRow(item){
    const meta = [];
    if(item.needed){
      if(item.addedBy) meta.push(`added by ${item.addedBy}`);
      if(item.lastBought) meta.push(`last bought ${timeAgo(item.lastBought)}`);
    } else {
      meta.push(`bought ${timeAgo(item.lastBought)}`);
      if(item.history && item.history[0] && item.history[0].by) meta.push(`by ${item.history[0].by}`);
    }
    const commentCount = (item.comments||[]).length;
    if(commentCount) meta.push(`💬 ${commentCount}`);

    const isOpen = expanded.has(item.id);

    const el = document.createElement("div");
    el.className = "item" + (item.needed ? "" : " bought");
    el.innerHTML = `
      <div class="item-row">
        ${item.needed ? `
          <button class="check ${item.needed ? '' : 'done'}" data-action="check" aria-label="Mark bought">
            <svg viewBox="0 0 16 16"><polyline points="3,9 6,12 13,4"/></svg>
          </button>
        ` : `
          <button class="check done" data-action="uncheck" aria-label="Move back to bought">
            <svg viewBox="0 0 16 16"><polyline points="3,9 6,12 13,4"/></svg>
          </button>
        `}
        <div class="item-main" data-action="toggle-comments">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-meta">${meta.map(m=>`<span>${escapeHtml(m)}</span>`).join("")}</div>
        </div>
        <div class="item-actions">
          ${!item.needed ? `<button class="replenish-btn" data-action="replenish">Need again</button>` : ""}
          <button class="icon-btn danger" data-action="delete" aria-label="Delete">✕</button>
        </div>
      </div>
      ${isOpen ? `
        <div class="comments">
          ${(item.comments||[]).length ? (item.comments||[]).map(c => `
            <div class="comment"><b>${escapeHtml(c.by||"someone")}</b> — ${escapeHtml(c.text)}</div>
          `).join("") : `<div class="comment" style="color:var(--ink-soft);border:none;">No comments yet.</div>`}
          <form class="comment-form" data-action="comment-form">
            <input type="text" placeholder="Add a note…" data-role="comment-input" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        </div>
      ` : ""}
    `;

    el.querySelector('[data-action="check"]')?.addEventListener("click", () => markBought(item));
    el.querySelector('[data-action="uncheck"]')?.addEventListener("click", () => replenish(item));
    el.querySelector('[data-action="replenish"]')?.addEventListener("click", (e) => { e.stopPropagation(); replenish(item); });
    el.querySelector('[data-action="delete"]')?.addEventListener("click", (e) => { e.stopPropagation(); removeItem(item); });
    el.querySelector('[data-action="toggle-comments"]')?.addEventListener("click", () => {
      if(expanded.has(item.id)) expanded.delete(item.id); else expanded.add(item.id);
      render();
    });
    const form = el.querySelector('[data-action="comment-form"]');
    if(form){
      form.addEventListener("click", e => e.stopPropagation());
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const input = form.querySelector('[data-role="comment-input"]');
        addComment(item, input.value);
        input.value = "";
      });
    }
    return el;
  }

  function escapeHtml(s){
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function render(){
    const need = state.items.filter(i => i.needed).sort((a,b)=> (b.addedAt||0)-(a.addedAt||0));
    const bought = state.items.filter(i => !i.needed).sort((a,b)=> (b.lastBought||0)-(a.lastBought||0));

    $("needCount").textContent = need.length;
    $("boughtCount").textContent = bought.length;

    const needList = $("needList");
    needList.innerHTML = "";
    if(need.length === 0){
      needList.innerHTML = `<div class="empty">Nothing on the list. Add something above.</div>`;
    } else {
      need.forEach(i => needList.appendChild(itemRow(i)));
    }

    const boughtList = $("boughtList");
    boughtList.style.display = boughtOpen ? "block" : "none";
    if(boughtOpen){
      boughtList.innerHTML = "";
      if(bought.length === 0){
        boughtList.innerHTML = `<div class="empty">Nothing bought yet.</div>`;
      } else {
        bought.forEach(i => boughtList.appendChild(itemRow(i)));
      }
    }
  }

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("addInput");
    addItem(input.value);
    input.value = "";
  });

  $("boughtToggle").addEventListener("click", () => {
    boughtOpen = !boughtOpen;
    document.querySelector("#boughtToggle span").textContent = boughtOpen ? "Previously bought ▴" : "Previously bought ▾";
    render();
  });

  $("changeNameBtn").addEventListener("click", () => openNameDialog());

  function openNameDialog(){
    $("nameInput").value = myName();
    nameDialog.showModal();
  }
  $("nameSubmit").addEventListener("click", (e) => {
    e.preventDefault();
    const v = $("nameInput").value.trim();
    if(v){
      setMyName(v);
      nameDialog.close();
    }
  });

  function init(){
    if(!myName()){
      openNameDialog();
    } else {
      $("whoamiLabel").textContent = "Signed in as " + myName();
    }
    fetchState();
    setInterval(() => { if(!pending) fetchState(); }, POLL_MS);
    window.addEventListener("online", fetchState);
  }

  init();
})();
</script>

</body>
</html>
